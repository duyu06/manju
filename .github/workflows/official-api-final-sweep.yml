name: Official API Final Sweep

on:
  push:
    branches:
      - cleanup/official-api-only
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v4
        with:
          ref: cleanup/official-api-only

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Remove final client compatibility surfaces
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def edit(path: str, transform):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              next_text = transform(text)
              if next_text != text:
                  p.write_text(next_text, encoding='utf-8')

          # Client provider type: no mutable Base URL and only official providers are testable.
          def patch_provider_card_types(text: str) -> str:
              text = text.replace("  onUpdateBaseUrl?: (providerId: string, baseUrl: string) => void\n", "")
              text = re.sub(
                  r"export const VERIFIABLE_PROVIDER_KEYS = new Set\(\[.*?\n\]\)",
                  "export const VERIFIABLE_PROVIDER_KEYS = new Set([\n  'openai', 'ark', 'google', 'minimax', 'vidu', 'bailian',\n])",
                  text,
                  flags=re.S,
              )
              return text
          edit('src/app/[locale]/profile/components/api-config/provider-card/types.ts', patch_provider_card_types)

          # Provider shell: compatibility badges are not part of official-only UI.
          def patch_shell(text: str) -> str:
              text = re.sub(
                  r"\nexport function getCompatibilityLayerBadgeLabel\(.*?\n\}\n\n",
                  "\n",
                  text,
                  flags=re.S,
              )
              text = text.replace("  const compatibilityLayerLabel = getCompatibilityLayerBadgeLabel(provider.id, t)\n", "")
              text = re.sub(
                  r"\n          \{compatibilityLayerLabel && \(.*?\n          \)\}",
                  "",
                  text,
                  flags=re.S,
              )
              return text
          edit('src/app/[locale]/profile/components/api-config/provider-card/ProviderCardShell.tsx', patch_shell)

          # Advanced model UI: no OpenAI-compatible/Gemini-compatible branches or hints.
          def patch_advanced(text: str) -> str:
              text = text.replace("import { getProviderKey, isPresetComingSoonModel, type CustomModel } from '../types'", "import { isPresetComingSoonModel, type CustomModel } from '../types'")
              text = re.sub(
                  r"export function getAddableModelTypesForProvider\(.*?\nfunction formatPriceAmount",
                  "export function getAddableModelTypesForProvider(_providerId: string): ProviderCardModelType[] {\n  return [...MODEL_TYPES]\n}\n\nexport function getVisibleModelTypesForProvider(\n  _providerId: string,\n  groupedModels: Partial<Record<ProviderCardModelType, CustomModel[]>>,\n): ProviderCardModelType[] {\n  return MODEL_TYPES.filter((type) => {\n    const modelsOfType = groupedModels[type]\n    return Array.isArray(modelsOfType) && modelsOfType.length > 0\n  })\n}\n\nfunction formatPriceAmount",
                  text,
                  flags=re.S,
              )
              text = text.replace("  const providerKey = getProviderKey(provider.id)\n", "")
              text = text.replace("  const defaultAddType: ProviderCardModelType = providerKey === 'openrouter' ? 'llm' : 'image'\n", "  const defaultAddType: ProviderCardModelType = 'image'\n")
              text = text.replace("  const useTabbedLayout = state.hasModels || shouldShowDefaultTabs(provider.id)\n", "  const useTabbedLayout = state.hasModels\n")
              text = re.sub(r"\n  const shouldShowVideoHint = .*?\n", "\n", text)
              text = re.sub(
                  r"\n          \{shouldShowVideoHint && \(.*?\n          \)\}",
                  "",
                  text,
                  flags=re.S,
              )
              text = re.sub(
                  r"\n          \{shouldShowOpenAICompatVideoHint\(provider.id, state.showAddForm\) && \(.*?\n          \)\}",
                  "",
                  text,
                  flags=re.S,
              )
              return text
          edit('src/app/[locale]/profile/components/api-config/provider-card/ProviderAdvancedFields.tsx', patch_advanced)

          # Provider-card state: remove Base URL editing and compatibility protocol probing.
          def patch_card_state(text: str) -> str:
              text = text.replace("  onUpdateBaseUrl: ProviderCardProps['onUpdateBaseUrl']\n", "")
              text = re.sub(
                  r"type LlmProtocolType = .*?\nexport function buildCustomPricingFromModelForm",
                  "export function shouldProbeModelLlmProtocol(_params: { providerId: string; modelType: ProviderCardModelType }): boolean {\n  return false\n}\n\nexport function shouldReprobeModelLlmProtocol(_params: {\n  providerId: string\n  originalModel: CustomModel\n  nextModelId: string\n}): boolean {\n  return false\n}\n\nexport async function probeModelLlmProtocolViaApi(_params: { providerId: string; modelId: string }): Promise<{\n  llmProtocol: 'responses' | 'chat-completions'\n  llmProtocolCheckedAt: string\n}> {\n  throw new Error('LLM_PROTOCOL_PROBE_DISABLED_IN_OFFICIAL_ONLY_MODE')\n}\n\ninterface ProviderConnectionPayload {\n  apiType: string\n  apiKey: string\n  llmModel?: string\n}\n\nexport function buildProviderConnectionPayload(params: {\n  providerKey: string\n  apiKey: string\n  llmModel?: string\n}): ProviderConnectionPayload {\n  const apiKey = params.apiKey.trim()\n  const llmModel = params.llmModel?.trim()\n  return {\n    apiType: params.providerKey,\n    apiKey,\n    ...(llmModel ? { llmModel } : {}),\n  }\n}\n\nexport function buildCustomPricingFromModelForm",
                  text,
                  flags=re.S,
              )
              for line in [
                  "  showBaseUrlEdit: boolean\n",
                  "  isEditingUrl: boolean\n",
                  "  tempUrl: string\n",
                  "  setTempUrl: (value: string) => void\n",
                  "  startEditUrl: () => void\n",
                  "  handleSaveUrl: () => void\n",
                  "  handleCancelUrlEdit: () => void\n",
              ]:
                  text = text.replace(line, "")
              text = text.replace("  onUpdateBaseUrl,\n", "")
              text = text.replace("  const [isEditingUrl, setIsEditingUrl] = useState(false)\n", "")
              text = text.replace("  const [tempUrl, setTempUrl] = useState(provider.baseUrl || '')\n", "")
              text = text.replace("  const assistantEnabled = providerKey === 'openai-compatible'\n", "  const assistantEnabled = false\n")
              text = re.sub(
                  r"\n  const showBaseUrlEdit =\n    \['gemini-compatible', 'openai-compatible'\]\.includes\(providerKey\) &&\n    Boolean\(onUpdateBaseUrl\)",
                  "",
                  text,
              )
              text = re.sub(
                  r"\n  const startEditUrl = \(\) => \{.*?\n  \}\n",
                  "\n",
                  text,
                  flags=re.S,
              )
              text = text.replace("        baseUrl: provider.baseUrl,\n", "")
              text = text.replace("      baseUrl: provider.baseUrl,\n", "")
              text = text.replace(", provider.baseUrl", "")
              text = text.replace("provider.baseUrl, ", "")
              text = re.sub(
                  r"\n  const handleSaveUrl = \(\) => \{.*?\n  const handleEditModel",
                  "\n  const handleEditModel",
                  text,
                  flags=re.S,
              )
              for token in [
                  "    showBaseUrlEdit,\n",
                  "    isEditingUrl,\n",
                  "    tempUrl,\n",
                  "    setTempUrl,\n",
                  "    startEditUrl,\n",
                  "    handleSaveUrl,\n",
                  "    handleCancelUrlEdit,\n",
              ]:
                  text = text.replace(token, "")
              return text
          edit('src/app/[locale]/profile/components/api-config/provider-card/hooks/useProviderCardState.ts', patch_card_state)

          # Top-level API config hook: provider list is preset-only; remove arbitrary provider/Base URL mutators.
          def patch_api_hooks(text: str) -> str:
              for line in [
                  "    updateProviderBaseUrl: (providerId: string, baseUrl: string) => void\n",
                  "    addProvider: (provider: Omit<Provider, 'hasApiKey'>) => void\n",
                  "    updateProviderInfo: (providerId: string, name: string, baseUrl?: string) => void\n",
              ]:
                  text = text.replace(line, "")
              text = re.sub(
                  r"            const providerBaseUrl = providerKey === 'minimax'.*?            seenPresetKeys.add\(providerKey\)",
                  "            merged.push({\n                ...matchedPreset,\n                apiKey,\n                hasApiKey: apiKey.length > 0,\n                hidden: savedProvider.hidden === true,\n                apiMode: savedProvider.apiMode,\n                gatewayRoute: 'official',\n            })\n            seenPresetKeys.add(providerKey)",
                  text,
                  flags=re.S,
              )
              text = text.replace("        merged.push({\n            ...savedProvider,\n            hasApiKey: !!savedProvider.apiKey,\n        })\n", "        continue\n")
              text = re.sub(
                  r"\n    const addProvider = useCallback\(.*?\n    \}, \[t, performSave\]\)\n",
                  "\n",
                  text,
                  flags=re.S,
              )
              text = re.sub(
                  r"\n    const updateProviderInfo = useCallback\(.*?\n    \}, \[performSave\]\)\n",
                  "\n",
                  text,
                  flags=re.S,
              )
              text = re.sub(
                  r"\n    const updateProviderBaseUrl = useCallback\(.*?\n    \}, \[performSave\]\)\n",
                  "\n",
                  text,
                  flags=re.S,
              )
              for token in [
                  "        updateProviderBaseUrl,\n",
                  "        addProvider,\n",
                  "        updateProviderInfo,\n",
              ]:
                  text = text.replace(token, "")
              return text
          edit('src/app/[locale]/profile/components/api-config/hooks.ts', patch_api_hooks)

          # Client Provider shape no longer carries a user-configurable endpoint.
          def patch_api_types(text: str) -> str:
              text = text.replace("    baseUrl?: string\n", "")
              text = text.replace("    { id: 'minimax', name: 'MiniMax Hailuo', baseUrl: 'https://api.minimaxi.com/v1' },", "    { id: 'minimax', name: 'MiniMax Hailuo' },")
              return text
          edit('src/app/[locale]/profile/components/api-config/types.ts', patch_api_types)
          PY

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Reject intermediary runtime surfaces
        shell: bash
        run: |
          set -euo pipefail
          forbidden='api\.evolink\.ai|queue\.fal\.run|openrouter\.ai/api|api\.siliconflow\.cn|@/lib/providers/evolink|@/lib/providers/fal|@/lib/providers/siliconflow|@fal-ai/client|@openrouter/|openai-compatible|gemini-compatible|onUpdateBaseUrl|updateProviderBaseUrl|probe-model-llm-protocol'
          if grep -RInE "$forbidden" src package.json .env.example --exclude-dir=node_modules; then
            echo 'Forbidden intermediary/compatibility runtime surface found.' >&2
            exit 1
          fi

      - name: Commit validated sweep
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "refactor: remove final client compatibility surfaces"
            git push origin HEAD:cleanup/official-api-only
          fi
