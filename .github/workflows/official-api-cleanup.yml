name: Official API Cleanup Validation

on:
  push:
    branches:
      - cleanup/official-api-only
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: mysql://root:official-only-ci@127.0.0.1:3306/aidrama_studio
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: official-only-ci
          MYSQL_DATABASE: aidrama_studio
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pofficial-only-ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v4
        with:
          ref: cleanup/official-api-only

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Reject intermediary runtime endpoints and imports
        shell: bash
        run: |
          set -euo pipefail
          forbidden='api\.evolink\.ai|queue\.fal\.run|openrouter\.ai/api|api\.siliconflow\.cn|@/lib/providers/evolink|@/lib/providers/fal|@/lib/providers/siliconflow|@fal-ai/client|@openrouter/sdk'
          if grep -RInE "$forbidden" src package.json .env.example --exclude-dir=node_modules; then
            echo "Forbidden intermediary runtime reference found"
            exit 1
          fi

      - name: Verify provider configuration cannot select a model Base URL
        run: |
          node <<'NODE'
          const fs = require('fs')

          function read(path) {
            return fs.readFileSync(path, 'utf8')
          }

          function interfaceBody(source, name) {
            const match = source.match(new RegExp(`export interface ${name}\\s*\\{([\\s\\S]*?)\\n\\}`))
            if (!match) throw new Error(`Could not find interface ${name}`)
            return match[1]
          }

          const runtimeConfig = read('src/lib/api-config.ts')
          const uiTypes = read('src/app/[locale]/profile/components/api-config/types.ts')
          const apiRoute = read('src/app/api/user/api-config/route.ts')
          const packageJson = JSON.parse(read('package.json'))

          if (/baseUrl/i.test(interfaceBody(runtimeConfig, 'ProviderConfig'))) {
            throw new Error('ProviderConfig must not expose baseUrl')
          }
          if (/baseUrl/i.test(interfaceBody(uiTypes, 'Provider'))) {
            throw new Error('Frontend Provider must not expose baseUrl')
          }
          if (!apiRoute.includes('PROVIDER_BASEURL_NOT_ALLOWED')) {
            throw new Error('API config write route must reject baseUrl')
          }

          const deps = { ...(packageJson.dependencies || {}), ...(packageJson.devDependencies || {}) }
          for (const forbiddenDependency of ['@fal-ai/client', '@openrouter/sdk']) {
            if (deps[forbiddenDependency]) {
              throw new Error(`Forbidden direct dependency: ${forbiddenDependency}`)
            }
          }

          for (const forbiddenProvider of ['evolink', 'fal', 'siliconflow', 'openrouter', 'openai-compatible', 'gemini-compatible']) {
            const presetPattern = new RegExp(`provider:\\s*['\"]${forbiddenProvider.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}['\"]`, 'i')
            if (presetPattern.test(uiTypes)) {
              throw new Error(`Forbidden provider remains in UI model presets: ${forbiddenProvider}`)
            }
          }
          NODE

      - name: Prepare empty contract database
        run: npx prisma db push --skip-generate

      - name: Verify model config contract
        run: npm run check:model-config-contract
