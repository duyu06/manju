name: Official API Cleanup Validation

on:
  push:
    branches:
      - cleanup/official-api-only
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v4
        with:
          ref: cleanup/official-api-only

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply follow-up official-only cleanup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def write(path: str, content: str) -> None:
              p = Path(path)
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(content.rstrip() + "\n", encoding="utf-8")

          def delete(path: str) -> None:
              p = Path(path)
              if p.exists():
                  p.unlink()

          # Compatibility-only API routes and tests are removed rather than
          # preserved as dead code.
          for path in [
              'src/app/api/user/api-config/assistant/probe-media-template/route.ts',
              'src/app/api/user/api-config/probe-model-llm-protocol/route.ts',
              'tests/integration/provider/fal-provider.contract.test.ts',
              'tests/unit/generators/factory.test.ts',
              'tests/unit/generators/image-provider-smoke.test.ts',
              'tests/unit/generators/openai-compatible-image.test.ts',
              'tests/unit/generators/openai-compatible-video.test.ts',
              'tests/unit/lipsync-preprocess.test.ts',
              'tests/unit/model-gateway/openai-compat-template-renderer.test.ts',
              'tests/unit/user-api/model-llm-protocol-probe.test.ts',
          ]:
              delete(path)

          # Remove probe exports from the legacy template helper barrel. The
          # remaining schema/save helpers are inert persistence compatibility,
          # not outbound routing.
          p = Path('src/lib/user-api/model-template/index.ts')
          if p.exists():
              text = p.read_text(encoding='utf-8')
              text = '\n'.join(
                  line for line in text.splitlines()
                  if "from './probe'" not in line
              ) + '\n'
              p.write_text(text, encoding='utf-8')

          # Voice binding UI: official Bailian voice IDs only. Uploaded reference
          # audio can still exist as an asset, but it is no longer a provider route.
          write('src/app/[locale]/workspace/[projectId]/modes/studio/components/voice/SpeakerVoiceBindingDialog.tsx', r'''
          'use client'

          import { useCallback, useState } from 'react'
          import { createPortal } from 'react-dom'
          import { useTranslations } from 'next-intl'
          import VoicePickerDialog from '@/app/[locale]/workspace/asset-hub/components/VoicePickerDialog'
          import VoiceCreationModal from '@/app/[locale]/workspace/asset-hub/components/VoiceCreationModal'
          import { AppIcon } from '@/components/ui/icons'
          import { SegmentedControl } from '@/components/ui/SegmentedControl'
          import type { InlineSpeakerVoiceBinding } from '@/lib/studio/stages/voice-stage-runtime/types'

          type BindingTab = 'select' | 'design'

          interface SpeakerVoiceBindingDialogProps {
            isOpen: boolean
            speaker: string
            projectId: string
            episodeId: string
            onClose: () => void
            onBound: (speaker: string, binding: InlineSpeakerVoiceBinding) => void
          }

          export default function SpeakerVoiceBindingDialog({ isOpen, speaker, onClose, onBound }: SpeakerVoiceBindingDialogProps) {
            const t = useTranslations('voice.inlineBinding')
            const [activeTab, setActiveTab] = useState<BindingTab>('select')
            const [subDialogOpen, setSubDialogOpen] = useState(false)

            const handleClose = useCallback(() => {
              setActiveTab('select')
              setSubDialogOpen(false)
              onClose()
            }, [onClose])

            const handleVoiceSelected = useCallback((voice: {
              id: string
              customVoiceUrl: string | null
              voiceId: string | null
              voiceType: string
            }) => {
              if (!voice.voiceId) {
                alert('当前音色没有官方百炼 Voice ID，请先使用 AI 音色设计创建可用音色。')
                return
              }
              onBound(speaker, {
                provider: 'bailian',
                voiceType: voice.voiceType,
                voiceId: voice.voiceId,
                ...(voice.customVoiceUrl ? { previewAudioUrl: voice.customVoiceUrl } : {}),
              })
              setSubDialogOpen(false)
              onClose()
            }, [speaker, onBound, onClose])

            const handleCreationSuccess = useCallback(() => {
              setActiveTab('select')
              setSubDialogOpen(true)
            }, [])

            if (!isOpen || typeof document === 'undefined') return null

            if (activeTab === 'select' && subDialogOpen) {
              return <VoicePickerDialog isOpen onClose={handleClose} onSelect={handleVoiceSelected} />
            }

            if (activeTab === 'design' && subDialogOpen) {
              return (
                <VoiceCreationModal
                  isOpen
                  folderId={null}
                  initialVoiceName={speaker}
                  onClose={handleClose}
                  onSuccess={handleCreationSuccess}
                />
              )
            }

            return createPortal(
              <>
                <div className="fixed inset-0 z-[9999] glass-overlay" onClick={handleClose} />
                <div className="fixed z-[10000] left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 glass-surface-modal w-full max-w-md overflow-hidden" onClick={(event) => event.stopPropagation()}>
                  <div className="flex items-center justify-between px-5 py-4 border-b border-[var(--glass-stroke-base)] bg-[var(--glass-bg-surface-strong)]">
                    <div className="flex items-center gap-2 min-w-0">
                      <AppIcon name="mic" className="w-5 h-5 text-[var(--glass-tone-info-fg)] shrink-0" />
                      <h2 className="font-semibold text-[var(--glass-text-primary)] truncate">{t('title', { speaker })}</h2>
                    </div>
                    <button onClick={handleClose} className="glass-btn-base glass-btn-soft p-1 text-[var(--glass-text-tertiary)] shrink-0">
                      <AppIcon name="close" className="w-5 h-5" />
                    </button>
                  </div>
                  <div className="px-5 pt-4 pb-2">
                    <p className="text-sm text-[var(--glass-text-secondary)]">仅支持模型厂商官方音色：选择已有百炼音色，或使用官方 AI 音色设计。</p>
                  </div>
                  <div className="px-5 py-3">
                    <SegmentedControl
                      options={[
                        { value: 'select' as const, label: t('selectFromLibrary') },
                        { value: 'design' as const, label: t('aiDesign') },
                      ]}
                      value={activeTab}
                      onChange={(value) => setActiveTab(value as BindingTab)}
                    />
                  </div>
                  <div className="p-5 text-center py-8">
                    <AppIcon name={activeTab === 'select' ? 'mic' : 'idea'} className="w-7 h-7 mx-auto mb-3 text-[var(--glass-tone-info-fg)]" />
                    <button onClick={() => setSubDialogOpen(true)} className="glass-btn-base glass-btn-primary px-8 py-2.5 rounded-lg text-sm font-medium">
                      {activeTab === 'select' ? t('selectFromLibrary') : t('aiDesign')}
                    </button>
                  </div>
                </div>
              </>,
              document.body,
            )
          }
          ''')

          write('src/app/api/studio/[projectId]/speaker-voice/route.ts', r'''
          import { NextRequest, NextResponse } from 'next/server'
          import { prisma } from '@/lib/prisma'
          import { getSignedUrl } from '@/lib/storage'
          import { requireProjectAuthLight, isErrorResponse } from '@/lib/api-auth'
          import { apiHandler, ApiError } from '@/lib/api-errors'
          import { resolveStorageKeyFromMediaValue } from '@/lib/media/service'
          import { parseSpeakerVoiceMap, type SpeakerVoiceEntry, type SpeakerVoiceMap } from '@/lib/voice/provider-voice-binding'

          function readTrimmedString(input: unknown): string | null {
            if (typeof input !== 'string') return null
            const value = input.trim()
            return value ? value : null
          }

          function signUrlIfNeeded(url: string): string {
            return url.startsWith('http') ? url : getSignedUrl(url, 7200)
          }

          export const GET = apiHandler(async (request: NextRequest, context: { params: Promise<{ projectId: string }> }) => {
            const { projectId } = await context.params
            const episodeId = new URL(request.url).searchParams.get('episodeId')
            const authResult = await requireProjectAuthLight(projectId)
            if (isErrorResponse(authResult)) return authResult
            if (!episodeId) throw new ApiError('INVALID_PARAMS')

            const episode = await prisma.studioEpisode.findUnique({ where: { id: episodeId } })
            if (!episode) throw new ApiError('NOT_FOUND')
            const stored = parseSpeakerVoiceMap(episode.speakerVoices)
            const speakerVoices: SpeakerVoiceMap = {}
            for (const [speaker, voice] of Object.entries(stored)) {
              const previewAudioUrl = voice.previewAudioUrl ? signUrlIfNeeded(voice.previewAudioUrl) : undefined
              speakerVoices[speaker] = {
                provider: 'bailian',
                voiceType: voice.voiceType,
                voiceId: voice.voiceId,
                ...(previewAudioUrl ? { previewAudioUrl } : {}),
              }
            }
            return NextResponse.json({ speakerVoices })
          })

          export const PATCH = apiHandler(async (request: NextRequest, context: { params: Promise<{ projectId: string }> }) => {
            const { projectId } = await context.params
            const authResult = await requireProjectAuthLight(projectId)
            if (isErrorResponse(authResult)) return authResult

            const body = await request.json().catch(() => null)
            const episodeId = readTrimmedString(body?.episodeId) ?? ''
            const speaker = readTrimmedString(body?.speaker) ?? ''
            const voiceType = readTrimmedString(body?.voiceType) ?? 'designed'
            const provider = readTrimmedString(body?.provider)?.toLowerCase() ?? ''
            const voiceId = readTrimmedString(body?.voiceId)
            const previewAudioUrl = readTrimmedString(body?.previewAudioUrl)
            if (!episodeId || !speaker || provider !== 'bailian' || !voiceId) throw new ApiError('INVALID_PARAMS')

            const project = await prisma.studioProject.findUnique({ where: { projectId }, select: { id: true } })
            if (!project) throw new ApiError('NOT_FOUND')
            const episode = await prisma.studioEpisode.findFirst({ where: { id: episodeId, studioProjectId: project.id }, select: { id: true, speakerVoices: true } })
            if (!episode) throw new ApiError('NOT_FOUND')

            const speakerVoices = parseSpeakerVoiceMap(episode.speakerVoices)
            const resolvedPreviewKey = previewAudioUrl ? await resolveStorageKeyFromMediaValue(previewAudioUrl) : null
            const nextVoiceEntry: SpeakerVoiceEntry = {
              provider: 'bailian',
              voiceType,
              voiceId,
              ...(previewAudioUrl ? { previewAudioUrl: resolvedPreviewKey || previewAudioUrl } : {}),
            }
            speakerVoices[speaker] = nextVoiceEntry
            await prisma.studioEpisode.update({ where: { id: episodeId }, data: { speakerVoices: JSON.stringify(speakerVoices) } })
            return NextResponse.json({ success: true })
          })
          ''')

          p = Path('src/app/api/studio/[projectId]/voice-generate/route.ts')
          if p.exists():
              text = p.read_text(encoding='utf-8')
              text = re.sub(
                  r"  if \(providerKey === 'bailian'\) \{.*?\n  \}\n\n  return \{\n    ok: false,\n    message: '请先为该发言人设置参考音频',\n  \}\n",
                  "  if (providerKey === 'bailian') {\n    if (character?.customVoiceUrl) {\n      return { ok: false, message: '当前仅支持百炼官方 Voice ID；请先使用 AI 音色设计创建音色。' }\n    }\n    return { ok: false, message: '请先为该发言人绑定百炼音色' }\n  }\n\n  return { ok: false, message: `不支持的官方音频提供商: ${providerKey}` }\n",
                  text,
                  flags=re.S,
              )
              p.write_text(text, encoding='utf-8')

          # Official async polling only. Unknown/legacy intermediary task IDs fail closed.
          write('src/lib/async-poll.ts', r'''
          import { logError as _ulogError } from '@/lib/logging/core'
          import { queryGeminiBatchStatus, queryGoogleVideoStatus, querySeedanceVideoStatus } from './async-task-utils'
          import { getProviderConfig } from './api-config'

          export interface PollResult {
            status: 'pending' | 'completed' | 'failed'
            resultUrl?: string
            imageUrl?: string
            videoUrl?: string
            downloadHeaders?: Record<string, string>
            error?: string
          }

          export type OfficialAsyncProvider = 'ARK' | 'GEMINI' | 'GOOGLE' | 'MINIMAX' | 'VIDU' | 'BAILIAN'
          export type OfficialAsyncType = 'VIDEO' | 'IMAGE' | 'BATCH'

          export function parseExternalId(externalId: string): {
            provider: OfficialAsyncProvider
            type: OfficialAsyncType
            requestId: string
          } {
            const parts = externalId.split(':')
            const provider = parts[0] as OfficialAsyncProvider
            const type = parts[1] as OfficialAsyncType
            const requestId = parts.slice(2).join(':').trim()
            const allowedProvider = new Set<OfficialAsyncProvider>(['ARK', 'GEMINI', 'GOOGLE', 'MINIMAX', 'VIDU', 'BAILIAN'])
            if (!allowedProvider.has(provider) || !requestId) throw new Error(`UNSUPPORTED_ASYNC_PROVIDER: ${parts[0] || 'UNKNOWN'}`)
            if (provider === 'GEMINI' && type !== 'BATCH') throw new Error('INVALID_GEMINI_EXTERNAL_ID')
            if (provider === 'GOOGLE' && type !== 'VIDEO') throw new Error('INVALID_GOOGLE_EXTERNAL_ID')
            if (provider !== 'GEMINI' && type !== 'VIDEO' && type !== 'IMAGE') throw new Error(`INVALID_EXTERNAL_ID_TYPE: ${type}`)
            return { provider, type, requestId }
          }

          export async function pollAsyncTask(externalId: string, userId: string): Promise<PollResult> {
            if (!userId) throw new Error('缺少用户ID，无法获取 API Key')
            const parsed = parseExternalId(externalId)
            if (parsed.provider === 'ARK') return await pollArk(parsed.requestId, userId)
            if (parsed.provider === 'GEMINI') return await pollGemini(parsed.requestId, userId)
            if (parsed.provider === 'GOOGLE') return await pollGoogle(parsed.requestId, userId)
            if (parsed.provider === 'MINIMAX') return await pollMiniMax(parsed.requestId, userId)
            if (parsed.provider === 'VIDU') return await pollVidu(parsed.requestId, userId)
            return await pollBailian(parsed.requestId, userId, parsed.type)
          }

          async function pollArk(taskId: string, userId: string): Promise<PollResult> {
            const { apiKey } = await getProviderConfig(userId, 'ark')
            const result = await querySeedanceVideoStatus(taskId, apiKey)
            return { status: result.status, videoUrl: result.videoUrl, resultUrl: result.videoUrl, error: result.error }
          }

          async function pollGemini(batchName: string, userId: string): Promise<PollResult> {
            const { apiKey } = await getProviderConfig(userId, 'google')
            const result = await queryGeminiBatchStatus(batchName, apiKey)
            return { status: result.status, imageUrl: result.imageUrl, resultUrl: result.imageUrl, error: result.error }
          }

          async function pollGoogle(operationName: string, userId: string): Promise<PollResult> {
            const { apiKey } = await getProviderConfig(userId, 'google')
            const result = await queryGoogleVideoStatus(operationName, apiKey)
            return { status: result.status, videoUrl: result.videoUrl, resultUrl: result.videoUrl, error: result.error }
          }

          async function pollMiniMax(taskId: string, userId: string): Promise<PollResult> {
            const { apiKey } = await getProviderConfig(userId, 'minimax')
            try {
              const response = await fetch(`https://api.minimaxi.com/v1/query/video_generation?task_id=${encodeURIComponent(taskId)}`, {
                headers: { Authorization: `Bearer ${apiKey}` },
              })
              if (!response.ok) return { status: 'failed', error: `MiniMax: 查询失败 ${response.status}` }
              const data = await response.json() as Record<string, any>
              if (data.base_resp?.status_code !== 0) return { status: 'failed', error: data.base_resp?.status_msg || 'MiniMax: 任务失败' }
              if (data.status === 'Failed') return { status: 'failed', error: data.error_message || 'MiniMax: 生成失败' }
              if (data.status !== 'Success') return { status: 'pending' }
              if (!data.file_id) return { status: 'failed', error: 'MiniMax: 任务完成但无 file_id' }
              const fileResponse = await fetch(`https://api.minimaxi.com/v1/files/retrieve?file_id=${encodeURIComponent(String(data.file_id))}`, {
                headers: { Authorization: `Bearer ${apiKey}` },
              })
              if (!fileResponse.ok) return { status: 'failed', error: `MiniMax: 文件检索失败 ${fileResponse.status}` }
              const fileData = await fileResponse.json() as Record<string, any>
              const videoUrl = typeof fileData.file?.download_url === 'string' ? fileData.file.download_url : ''
              return videoUrl ? { status: 'completed', videoUrl, resultUrl: videoUrl } : { status: 'failed', error: 'MiniMax: 未返回视频 URL' }
            } catch (error) {
              _ulogError('[MiniMax Query] 异常:', error)
              return { status: 'failed', error: error instanceof Error ? error.message : String(error) }
            }
          }

          async function pollVidu(taskId: string, userId: string): Promise<PollResult> {
            const { apiKey } = await getProviderConfig(userId, 'vidu')
            try {
              const response = await fetch(`https://api.vidu.cn/ent/v2/tasks/${encodeURIComponent(taskId)}/creations`, {
                headers: { Authorization: `Token ${apiKey}` },
              })
              if (!response.ok) return { status: 'failed', error: `Vidu: 查询失败 ${response.status}` }
              const data = await response.json() as Record<string, any>
              if (data.state === 'failed') return { status: 'failed', error: `Vidu: ${data.err_code || 'Unknown'}` }
              if (data.state !== 'success') return { status: 'pending' }
              const videoUrl = Array.isArray(data.creations) && typeof data.creations[0]?.url === 'string' ? data.creations[0].url : ''
              return videoUrl ? { status: 'completed', videoUrl, resultUrl: videoUrl } : { status: 'failed', error: 'Vidu: 任务完成但无视频 URL' }
            } catch (error) {
              return { status: 'failed', error: error instanceof Error ? error.message : String(error) }
            }
          }

          async function pollBailian(requestId: string, userId: string, type: OfficialAsyncType): Promise<PollResult> {
            const { apiKey } = await getProviderConfig(userId, 'bailian')
            try {
              const response = await fetch(`https://dashscope.aliyuncs.com/api/v1/tasks/${encodeURIComponent(requestId)}`, {
                headers: { Authorization: `Bearer ${apiKey}` },
              })
              const data = await response.json().catch(() => ({})) as Record<string, any>
              if (!response.ok) return { status: 'failed', error: `Bailian: 查询失败 ${response.status}` }
              const status = String(data.output?.task_status || data.task_status || '').toUpperCase()
              if (status === 'FAILED' || status === 'CANCELED' || status === 'CANCELLED') {
                return { status: 'failed', error: data.output?.message || data.message || 'Bailian: 任务失败' }
              }
              if (status !== 'SUCCEEDED' && status !== 'SUCCESS') return { status: 'pending' }
              const first = Array.isArray(data.output?.results) ? data.output.results[0] : undefined
              const videoUrl = data.output?.video_url || first?.video_url
              const imageUrl = data.output?.image_url || first?.image_url || first?.url
              const resultUrl = type === 'VIDEO' ? videoUrl : (imageUrl || videoUrl)
              if (!resultUrl) return { status: 'failed', error: 'Bailian: 任务完成但未返回结果 URL' }
              return {
                status: 'completed',
                resultUrl,
                ...(type === 'VIDEO' ? { videoUrl: resultUrl } : { imageUrl: resultUrl }),
              }
            } catch (error) {
              return { status: 'failed', error: error instanceof Error ? error.message : String(error) }
            }
          }

          export function formatExternalId(provider: OfficialAsyncProvider, type: OfficialAsyncType, requestId: string): string {
            if (!requestId.trim()) throw new Error('ASYNC_REQUEST_ID_REQUIRED')
            return `${provider}:${type}:${requestId}`
          }
          ''')

          # Reference-to-character: poll the official externalId returned by the
          # selected image provider instead of hard-coding FAL queue semantics.
          p = Path('src/lib/workers/handlers/reference-to-character.ts')
          if p.exists():
              text = p.read_text(encoding='utf-8')
              text = text.replace("import { queryFalStatus } from '@/lib/async-submit'\n", "import { pollAsyncTask } from '@/lib/async-poll'\n")
              text = text.replace("import { getProviderConfig } from '@/lib/api-config'\n", '')
              text = text.replace('  falApiKey?: string | null\n', '')
              text = text.replace('    falApiKey,\n', '')
              text = re.sub(
                  r"    const requestId = typeof result\.requestId === 'string' \? result\.requestId : ''\n    const endpoint = typeof result\.endpoint === 'string' \? result\.endpoint : ''\n    if \(result\.async && requestId && endpoint\) \{.*?\n    \}\n",
                  "    const externalId = typeof result.externalId === 'string' ? result.externalId.trim() : ''\n    if (result.async) {\n      if (!externalId) throw new Error('OFFICIAL_ASYNC_EXTERNAL_ID_REQUIRED')\n      for (let attempt = 0; attempt < POLL_MAX_ATTEMPTS; attempt += 1) {\n        await assertTaskActive(job, `reference_to_character_poll_${imageIndex + 1}_${attempt + 1}`)\n        await new Promise((resolve) => setTimeout(resolve, POLL_INTERVAL_MS))\n        const status = await pollAsyncTask(externalId, userId)\n        if (status.status === 'completed' && status.resultUrl) { finalImageUrl = status.resultUrl; break }\n        if (status.status === 'failed') return null\n      }\n    }\n",
                  text,
                  flags=re.S,
              )
              text = re.sub(r"\n  const \{ apiKey: falApiKey \} = await getProviderConfig\(job\.data\.userId, 'fal'\)", '', text)
              text = text.replace('      falApiKey,\n', '')
              p.write_text(text, encoding='utf-8')
          PY

          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "refactor: remove final compatibility runtime references"
            git push origin HEAD:cleanup/official-api-only
          fi

      - name: Synchronize package lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Reject intermediary runtime endpoints and imports
        shell: bash
        run: |
          set -euo pipefail
          forbidden='api\.evolink\.ai|queue\.fal\.run|openrouter\.ai/api|api\.siliconflow\.cn|@/lib/providers/evolink|@/lib/providers/fal|@/lib/providers/siliconflow|@fal-ai/client|@openrouter/'
          if grep -RInE "$forbidden" src package.json .env.example --exclude-dir=node_modules; then
            echo "Forbidden intermediary runtime reference found"
            exit 1
          fi

      - name: Verify official model config contract
        run: npm run check:model-config-contract
