name: Official API Cleanup Validation

on:
  push:
    branches:
      - cleanup/official-api-only
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v4
        with:
          ref: cleanup/official-api-only

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Synchronize package lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit synchronized lockfile
        shell: bash
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: sync lockfile after provider cleanup"
            git push origin HEAD:cleanup/official-api-only
          fi

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Reject intermediary runtime endpoints and imports
        shell: bash
        run: |
          set -euo pipefail
          forbidden='api\.evolink\.ai|queue\.fal\.run|openrouter\.ai/api|api\.siliconflow\.cn|@/lib/providers/evolink|@/lib/providers/fal|@/lib/providers/siliconflow|@fal-ai/client|@openrouter/'
          if grep -RInE "$forbidden" src package.json .env.example --exclude-dir=node_modules; then
            echo "Forbidden intermediary runtime reference found"
            exit 1
          fi

      - name: Verify official model config contract
        run: npm run check:model-config-contract
